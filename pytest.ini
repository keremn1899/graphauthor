[pytest]
testpaths =
    tests
# One full suite run writes ~1.9G into `tmp_path`, most of it materialised
# `.lbug` graphs. pytest keeps the last three runs by default and /tmp here is a
# 7.3G tmpfs, so three consecutive runs filled it — taking the desktop
# environment down and producing 149 failures and 173 errors that were every one
# of them `OSError: [Errno 122] Disk quota exceeded` wearing the costume of a
# code regression. Keeping only failed runs caps it at what debugging needs.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    integration: full pipeline / OpenRouter (requires OPENROUTER_API_KEY).
    degradation_observability: v5 degradation signal propagation tests.
    brief_integrity: v5 evidence brief validation layer tests.
    structural_audit: v5 candidate set structural audit tests.
    planner_mode: v5 planner_mode propagation tests.
    cross_cluster: v5 cross-cluster continuation detection tests.
    b_reasoning: v5 B-reasoning downward context tests.
    battalion_calibration: v5 Battalion confidence calibration tests.
