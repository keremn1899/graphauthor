[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphauthor"
version = "0.1.0"
description = "A local, source-cited graph context layer for agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Kerem" }]
keywords = ["knowledge-graph", "traversal", "agents", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "real_ladybug>=0.15.0,<0.16",
    "pydantic>=2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
http = ["mcp>=1.0,<2", "starlette>=0.37,<1", "uvicorn>=0.29"]
construct = ["beautifulsoup4>=4.12.0"]
dev = ["pytest>=8.0.0"]
all = [
    "mcp>=1.0,<2", "starlette>=0.37,<1", "uvicorn>=0.29",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
graphauthor = "mcp_server.bootstrap:main"
graphauthor-mcp = "mcp_server.stdio:main"

[project.urls]

[tool.setuptools]
include-package-data = true
py-modules = [
    "backend_tools",
    "contract",
    "engine",
    "graph_overlay",
    "graph_read",
    "models",
    "normative",
    "retrieval_program",
    "tools",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "graph_storage*",
    "graph_layout*",
    "interaction*",
    "mcp_server*",
    "source_pipeline*",
    "write_path*",
]
exclude = [
    "tests*",
    "examples*",
    "demo*",
    "tools*",
    "scripts*",
    "archive*",
    "data*",
    "scratch*",
    "lib*",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml", "*.json"]
