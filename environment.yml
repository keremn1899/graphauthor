# Conda environment for Graphauthor
# Create:   conda env create -f environment.yml
# Activate: conda activate agentic-graphrag
# Update:   conda env update -f environment.yml --prune

name: agentic-graphrag
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - pip
  - pip:
      - -r requirements.txt
